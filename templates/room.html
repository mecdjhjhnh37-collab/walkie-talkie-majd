<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice Room</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="room-page">


<!-- الهيدر -->

<div class="room-header">


<div class="room-user">

<img 
class="room-avatar"
src="https://i.imgur.com/6VBx3io.png">


<div>

<h1 id="roomTitle">
🎙️ اسم الغرفة
</h1>


<p>
🟢 Online
</p>


</div>


</div>



<div class="room-actions">


<button id="callBtn">
📞
</button>


<button id="videoBtn">
📹
</button>


</div>



</div>





<!-- الأعضاء -->

<div class="room-members">


<span>
👥 1 / 10
</span>


<div class="members-list">

<img src="https://i.imgur.com/6VBx3io.png">
<img src="https://i.imgur.com/6VBx3io.png">
<img src="https://i.imgur.com/6VBx3io.png">

</div>


</div>






<!-- الرسائل -->


<div class="room-chat" id="messages">


</div>







<!-- الكتابة -->


<div class="room-input">


<button>
📷
</button>


<input
id="messageInput"
type="text"
placeholder="اكتب رسالة...">



<button id="sendMessage">
➤
</button>



<button>
🎤
</button>


<button>
➕
</button>


</div>







<!-- زر الضغط للتحدث -->


<div class="push-talk">


<button id="voiceBtn">
🎙️
</button>


</div>






</div>





<script src="{{ url_for('static', filename='language.js') }}"></script>


<script type="module"
src="{{ url_for('static', filename='room.js') }}">
</script>


</body>

</html>
