<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="background"></div>

<div class="home">

<div class="profile">

<img id="userPhoto"
src="https://i.imgur.com/6VBx3io.png"
class="avatar">


<h2 id="userName">
جارٍ التحميل...
</h2>


<p id="userId">
ID : ------
</p>


<div class="status">
🟢 Online
</div>


</div>


<h1 class="title">
🎙️ Mecd Voice
</h1>


<div class="menu">


<button>
👥 <span id="friendsText">الأصدقاء</span>
</button>


<button id="createRoomBtn">
🎙️ <span id="createRoomText">إنشاء غرفة</span>
</button>


<button>
🚪 <span id="joinRoomText">دخول إلى غرفة</span>
</button>


<button>
🌍 <span id="publicRoomsText">الغرف العامة</span>
</button>


<button>
⚙️ <span id="settingsText">الإعدادات</span>
</button>


</div>


</div>


<script src="{{ url_for('static', filename='language.js') }}"></script>


<script type="module"
src="{{ url_for('static', filename='main.js') }}">
</script>


<script type="module" src="{{ url_for('static', filename='user.js') }}"></script>
<!-- نافذة إنشاء الغرفة -->
<div id="roomPopup" class="popup">

    <div class="popup-box">

        <h2 id="roomPopupTitle">
            إنشاء غرفة
        </h2>

        <input
            id="newRoomName"
            type="text"
            placeholder="اسم الغرفة">

        <input
            id="roomPassword"
            type="password"
            placeholder="كلمة المرور">

        <label>

            <input
                type="radio"
                name="roomType"
                value="public"
                checked>

            <span id="publicRoomText">
                عامة
            </span>

        </label>

        <label>

            <input
                type="radio"
                name="roomType"
                value="private">

            <span id="privateRoomText">
                خاصة
            </span>

        </label>

        <label id="membersText">
            عدد الأشخاص
        </label>

        <select id="roomMembers">

            <option>2</option>
            <option>5</option>
            <option selected>10</option>
            <option>20</option>
            <option>50</option>

        </select>

        <div class="popup-buttons">

            <button id="createRoomNow">
                إنشاء
            </button>

            <button id="cancelRoom">
                إلغاء
            </button>

        </div>

    </div>

</div>
</body>
</html>
