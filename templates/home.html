<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mecd Voice</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="home">


    <!-- =========================
         معلومات الحساب
    ========================== -->

    <div class="profile">

        <img
        id="userPhoto"
        src="https://i.imgur.com/6VBx3io.png"
        class="avatar">

        <h2 id="userName">
            جارٍ التحميل...
        </h2>

        <p id="userId">
            ID : ------
        </p>

        <div class="status">
            🟢 Online
        </div>

    </div>


    <h1 class="title">
        🎙️ Mecd Voice
    </h1>


    <!-- =========================
         أزرار الصفحة الرئيسية
    ========================== -->

    <div class="menu">

        <button id="friendsBtn" type="button">

            👥

            <span id="friendsText">
                الأصدقاء
            </span>

        </button>


        <button id="createRoomBtn" type="button">

            🎙️

            <span id="createRoomText">
                إنشاء غرفة
            </span>

        </button>


        <button id="joinRoomBtn" type="button">

            🚪

            <span id="joinRoomText">
                دخول إلى غرفة
            </span>

        </button>


        <button id="publicRoomsBtn" type="button">

            🌍

            <span id="publicRoomsText">
                الغرف العامة
            </span>

        </button>


        <button id="settingsBtn" type="button">

            ⚙️

            <span id="settingsText">
                الإعدادات
            </span>

        </button>

    </div>

</div>



<!-- ==================================================
     نافذة إنشاء الغرفة
================================================== -->

<div id="roomPopup" class="popup">

    <div class="popup-box">

        <h2 id="roomPopupTitle"></h2>


        <input
        id="newRoomName"
        type="text">


        <input
        id="roomPassword"
        type="password">


        <label>

            <input
            type="radio"
            name="roomType"
            value="public"
            checked>

            <span id="publicRoomText"></span>

        </label>


        <label>

            <input
            type="radio"
            name="roomType"
            value="private">

            <span id="privateRoomText"></span>

        </label>


        <label id="membersText"></label>


        <select id="roomMembers">

            <option>2</option>
            <option>5</option>
            <option selected>10</option>
            <option>20</option>
            <option>50</option>

        </select>


        <div class="popup-buttons">

            <button
            id="createRoomNow"
            type="button">
            </button>


            <button
            id="cancelRoom"
            type="button">
            </button>

        </div>

    </div>

</div>



<!-- ==================================================
     نافذة دخول إلى غرفة
================================================== -->

<div id="joinRoomPopup" class="popup">

    <div class="popup-box">

        <h2 id="joinRoomTitle">
            🚪 دخول إلى غرفة
        </h2>


        <input
        id="joinRoomId"
        type="text"
        placeholder="أدخل ID الغرفة"
        autocomplete="off">


        <div class="popup-buttons">

            <button
            id="joinRoomNow"
            type="button">
            دخول
            </button>


            <button
            id="cancelJoinRoom"
            type="button">
            إلغاء
            </button>

        </div>

    </div>

</div>



<!-- ==================================================
     الملفات
================================================== -->

<script src="{{ url_for('static', filename='language.js') }}"></script>


<script
type="module"
src="{{ url_for('static', filename='main.js') }}">
</script>


<script
type="module"
src="{{ url_for('static', filename='user.js') }}">
</script>


<script
type="module"
src="{{ url_for('static', filename='create-room.js') }}">
</script>



<!-- ==================================================
     تشغيل زر دخول إلى غرفة
================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const joinBtn =
        document.getElementById("joinRoomBtn");

    const joinPopup =
        document.getElementById("joinRoomPopup");

    const joinNow =
        document.getElementById("joinRoomNow");

    const cancelJoin =
        document.getElementById("cancelJoinRoom");

    const roomIdInput =
        document.getElementById("joinRoomId");


    /* فتح نافذة الدخول */

    if (joinBtn) {

        joinBtn.addEventListener("click", function () {

            joinPopup.style.display = "flex";

            roomIdInput.value = "";

            setTimeout(function () {
                roomIdInput.focus();
            }, 100);

        });

    }


    /* إلغاء */

    if (cancelJoin) {

        cancelJoin.addEventListener("click", function () {

            joinPopup.style.display = "none";

        });

    }


    /* الدخول إلى الغرفة */

    if (joinNow) {

        joinNow.addEventListener("click", function () {

            const roomId =
                roomIdInput.value.trim();


            if (!roomId) {

                alert("أدخل ID الغرفة أولاً");

                return;

            }


            /*
             * ننتقل إلى صفحة الغرفة
             * ونرسل معها ID الغرفة
             */

            window.location.href =
                "/room?roomId=" +
                encodeURIComponent(roomId);

        });

    }


    /* الضغط خارج النافذة لإغلاقها */

    if (joinPopup) {

        joinPopup.addEventListener("click", function (event) {

            if (event.target === joinPopup) {

                joinPopup.style.display = "none";

            }

        });

    }

});

</script>
<script src="{{ url_for('static', filename='language.js') }}"></script>

<script type="module"
src="{{ url_for('static', filename='main.js') }}">
</script>

<script type="module"
src="{{ url_for('static', filename='user.js') }}">
</script>

<script type="module"
src="{{ url_for('static', filename='create-room.js') }}">
</script>

</body>

</html>
